name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          echo "Triggering deploy on VPS..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://mediageek.io/webhook/deploy \
            -H "Content-Type: application/json" \
            -d '{"secret":"mediageek-deploy-2026"}' \
            --max-time 15)
          if [ "$response" = "200" ]; then
            echo "✅ Deploy triggered successfully (HTTP $response)"
            echo "VPS will run: git pull + npm install + npm build + pm2 restart"
            echo "Monitor: pm2 logs mediageek"
          else
            echo "❌ Webhook returned HTTP $response"
            exit 1
          fi

  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build techsites-landing
        run: pnpm --filter @workspace/techsites-landing run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production

      - name: Build waashost-landing
        run: pnpm --filter @workspace/waashost-landing run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production

      - name: Deploy techsites-landing to Cloudflare Pages
        run: |
          npx wrangler pages deploy artifacts/techsites-landing/dist/public \
            --project-name techsites-ai \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy waashost-landing to Cloudflare Pages
        run: |
          npx wrangler pages deploy artifacts/waashost-landing/dist/public \
            --project-name waashost \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build apex-meeting
        run: pnpm --filter @workspace/apex-meeting run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production

      - name: Deploy apex-meeting to Cloudflare Pages
        run: |
          npx wrangler pages deploy artifacts/apex-meeting/dist/public \
            --project-name apex-meeting \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
