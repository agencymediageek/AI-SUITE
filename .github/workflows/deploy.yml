name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook (mediageek)
        continue-on-error: true
        run: |
          echo "Triggering mediageek deploy on VPS..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://mediageek.io/webhook/deploy \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DEPLOY_WEBHOOK_SECRET }}\"}" \
            --max-time 15)
          if [ "$response" = "200" ]; then
            echo "✅ Deploy triggered successfully (HTTP $response)"
            echo "VPS will run: git pull + npm install + npm build + pm2 restart"
            echo "Monitor: pm2 logs mediageek"
          else
            echo "⚠️  Webhook returned HTTP $response (non-blocking)"
          fi

  deploy-apex:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger APEX deploy on VPS
        continue-on-error: true
        run: |
          echo "Triggering APEX deploy on VPS..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://apex.techsites.ai/webhook/deploy-apex \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DEPLOY_WEBHOOK_SECRET }}\"}" \
            --max-time 20)
          if [ "$response" = "200" ]; then
            echo "✅ APEX deploy triggered (HTTP $response)"
            echo "VPS will run: git pull + build api-server + build apex-meeting + pm2 restart apex-api"
            echo "Monitor: pm2 logs apex-api"
          else
            echo "⚠️  Webhook returned HTTP $response (non-blocking)"
          fi

  deploy-wptechsites:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger WP TechSites deploy on VPS
        continue-on-error: true
        run: |
          echo "Triggering WP TechSites deploy on VPS..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://wp.techsites.ai/webhook/deploy-wptechsites \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${{ secrets.DEPLOY_WEBHOOK_SECRET }}\"}" \
            --max-time 20)
          if [ "$response" = "200" ]; then
            echo "✅ WP TechSites deploy triggered (HTTP $response)"
            echo "VPS will run: git pull + build api-server + build dashboard + pm2 restart"
            echo "Monitor: pm2 logs wptechsites-api"
          else
            echo "⚠️  Webhook returned HTTP $response (non-blocking)"
          fi

  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build techsites-landing
        run: pnpm --filter @workspace/techsites-landing run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production

      - name: Build waashost-landing
        run: pnpm --filter @workspace/waashost-landing run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production

      - name: Deploy techsites-landing to Cloudflare Pages
        run: |
          npx wrangler pages deploy artifacts/techsites-landing/dist/public \
            --project-name techsites-ai \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy waashost-landing to Cloudflare Pages
        run: |
          npx wrangler pages deploy artifacts/waashost-landing/dist/public \
            --project-name waashost \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build apex-meeting
        run: pnpm --filter @workspace/apex-meeting run build
        env:
          PORT: 3000
          BASE_PATH: /
          NODE_ENV: production

      - name: Create apex-meeting Pages project (if not exists)
        run: |
          npx wrangler pages project create apex-meeting \
            --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy apex-meeting to Cloudflare Pages
        run: |
          npx wrangler pages deploy artifacts/apex-meeting/dist/public \
            --project-name apex-meeting \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build apex-video
        run: pnpm --filter @workspace/apex-video run build
        env:
          PORT: 3001
          BASE_PATH: /
          NODE_ENV: production

      - name: Deploy apex-video to Cloudflare Pages
        run: |
          npx wrangler pages deploy artifacts/apex-video/dist/public \
            --project-name apex-video \
            --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
