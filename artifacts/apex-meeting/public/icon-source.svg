<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="80" fill="#000000"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="200" stroke="#00FF41" stroke-width="3" fill="none" opacity="0.4"/>
  <circle cx="256" cy="256" r="160" stroke="#00FF41" stroke-width="2" fill="none" opacity="0.3"/>
  <!-- Latitude lines -->
  <ellipse cx="256" cy="256" rx="200" ry="70" stroke="#00FF41" stroke-width="1.5" fill="none" opacity="0.3"/>
  <ellipse cx="256" cy="256" rx="200" ry="130" stroke="#00FF41" stroke-width="1.5" fill="none" opacity="0.25"/>
  <!-- Vertical meridians -->
  <ellipse cx="256" cy="256" rx="70" ry="200" stroke="#00FF41" stroke-width="1.5" fill="none" opacity="0.3"/>
  <ellipse cx="256" cy="256" rx="130" ry="200" stroke="#00FF41" stroke-width="1.5" fill="none" opacity="0.25"/>
  <!-- Center glow -->
  <circle cx="256" cy="256" r="48" fill="#00FF41" opacity="0.9"/>
  <circle cx="256" cy="256" r="32" fill="#00FF41"/>
  <!-- Matrix text dots -->
  <circle cx="200" cy="160" r="4" fill="#00FF41" opacity="0.7"/>
  <circle cx="230" cy="130" r="3" fill="#00FF41" opacity="0.5"/>
  <circle cx="310" cy="145" r="4" fill="#00FF41" opacity="0.6"/>
  <circle cx="340" cy="190" r="3" fill="#00FF41" opacity="0.5"/>
  <circle cx="350" cy="310" r="4" fill="#00FF41" opacity="0.7"/>
  <circle cx="170" cy="340" r="3" fill="#00FF41" opacity="0.5"/>
  <circle cx="190" cy="380" r="4" fill="#00FF41" opacity="0.6"/>
  <circle cx="320" cy="370" r="3" fill="#00FF41" opacity="0.5"/>
</svg>
