kind = "web"
previewPath = "/apex-meeting/"
title = "APEX CORE MEETING"
version = "1.0.0"
id = "artifacts/apex-meeting"
router = "path"

[[services]]
name = "web"
paths = [ "/apex-meeting/" ]
localPort = 18363

[services.development]
run = "pnpm --filter @workspace/apex-meeting run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/apex-meeting", "run", "build" ]
serve = "static"
publicDir = "artifacts/apex-meeting/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18363"
BASE_PATH = "/apex-meeting/"
